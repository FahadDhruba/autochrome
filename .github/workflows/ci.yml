name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm docs:tools --check
      - run: pnpm build
      - run: pnpm --filter @autochrome/extension exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm --filter @autochrome/extension zip
      - uses: actions/upload-artifact@v4
        with:
          name: autochrome-extension-zip
          path: packages/extension/.output/*.zip
          if-no-files-found: error
          # .output is a dot-directory, which upload-artifact treats as hidden.
          include-hidden-files: true
