name: Release

# Runs after CI passes on main. For the version in package.json it creates whatever is missing:
# the tag and GitHub release (with the extension zip), and the autochrome-bridge package on npm.
# So releasing is: bump the version, add a CHANGELOG section, merge. Merges that do not change the
# version do nothing, and a re-run only finishes the parts that failed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  # npm trusted publishing: npm verifies this workflow's OIDC identity instead of a stored token.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version and what is already released
        id: version
        run: |
          version=$(node -p "require('./packages/extension/package.json').version")
          bridge=$(node -p "require('./packages/bridge/package.json').version")
          package=$(node -p "require('./packages/bridge/package.json').name")
          if [ "$version" != "$bridge" ]; then
            echo "::error::Extension ($version) and bridge ($bridge) versions differ."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

          if gh release view "v$version" >/dev/null 2>&1; then
            echo "GitHub release v$version exists."
            echo "github=false" >> "$GITHUB_OUTPUT"
          else
            echo "github=true" >> "$GITHUB_OUTPUT"
          fi
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "$package@$version is on npm."
            echo "npm=false" >> "$GITHUB_OUTPUT"
          else
            echo "npm=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.github == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The "## [VERSION]" section, without the link definitions at the end of the file.
          awk -v v="$VERSION" '/^## \[/{p = index($0, "## [" v "]") == 1; next} p' CHANGELOG.md \
            | { grep -v '^\[[^]]*\]: ' || true; } > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.github == 'true' || steps.version.outputs.npm == 'true'
      - uses: actions/setup-node@v4
        if: steps.version.outputs.github == 'true' || steps.version.outputs.npm == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Build
        if: steps.version.outputs.github == 'true' || steps.version.outputs.npm == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Create the tag and GitHub release
        if: steps.version.outputs.github == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm --filter @autochrome/extension zip
          gh release create "v$VERSION" \
            "packages/extension/.output/autochrome-$VERSION-chrome.zip" \
            --target "$SHA" \
            --title "v$VERSION" \
            --notes-file notes.md

      - name: Publish the bridge to npm
        if: steps.version.outputs.npm == 'true'
        env:
          PACKAGE: ${{ steps.version.outputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
          npm install -g npm@^11.5.1
          # pnpm pack turns workspace: dependencies into real versions; npm publish then uses OIDC
          # and adds a provenance statement linking the package to this commit.
          mkdir -p dist-npm
          (cd packages/bridge && pnpm pack --pack-destination ../../dist-npm)
          # The ./ matters: without it npm reads "dist-npm/x.tgz" as a GitHub user/repo.
          npm publish "./dist-npm/$PACKAGE-$VERSION.tgz" --access public
